<!DOCTYPE html>
<html>
<head>
    <title>Fetch Test</title>
</head>
<body>
    <h1>Testing Fetch</h1>
    <div id="output"></div>
    
    <script>
        console.log('Starting fetch test...');
        
        async function testFetch() {
            const output = document.getElementById('output');
            
            try {
                output.innerHTML += '<p>Testing fetch...</p>';
                
                const response = await fetch('./js/brooklyn-bar-data.json');
                output.innerHTML += `<p>Response status: ${response.status}</p>`;
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const text = await response.text();
                output.innerHTML += `<p>Response length: ${text.length}</p>`;
                
                const data = JSON.parse(text);
                output.innerHTML += `<p>Parsed data keys: ${Object.keys(data).length}</p>`;
                output.innerHTML += `<p>First neighborhood: ${Object.values(data)[0].displayName}</p>`;
                
            } catch (error) {
                console.error('Fetch failed:', error);
                output.innerHTML += `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
        
        // Test immediately
        testFetch();
        
        // Also test on DOM load
        document.addEventListener('DOMContentLoaded', testFetch);
    </script>
</body>
</html>
