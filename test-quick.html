<!DOCTYPE html>
<html>
<head>
    <title>Quick Test</title>
</head>
<body>
    <h1>Quick Test - If you see this, HTML works</h1>
    <div id="test">Testing...</div>
    
    <script>
        console.log('Basic JavaScript works');
        document.getElementById('test').textContent = 'JavaScript is working!';
        
        // Test if we can import modules
        try {
            import('./js/neighborhoods.js')
                .then(() => console.log('Module loaded successfully'))
                .catch(error => console.error('Module loading failed:', error));
        } catch (error) {
            console.error('Import failed:', error);
        }
    </script>
</body>
</html>
